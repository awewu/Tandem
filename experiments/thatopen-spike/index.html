<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThatOpen Spike · W-BIM-4 选型验证</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #container { width: 100%; height: 100%; position: relative; }
    #toolbar {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      display: flex; gap: 8px; align-items: center;
      background: rgba(255,255,255,.92); padding: 8px 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15); font-size: 13px;
    }
    #status { color: #555; }
    button, label.btn {
      cursor: pointer; border: 1px solid #ccc; border-radius: 6px;
      padding: 4px 10px; background: #fff; font-size: 13px;
    }
    button:hover, label.btn:hover { background: #f0f0f0; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div id="container">
    <div id="toolbar">
      <label class="btn" for="ifc-input">加载 IFC</label>
      <input type="file" id="ifc-input" accept=".ifc" />
      <button id="toggle-clip">剖切: 关</button>
      <button id="create-clip">放剖切面</button>
      <button id="delete-clip">删剖切面</button>
      <button id="toggle-hide">隐藏选中</button>
      <button id="reset-hide">全部显示</button>
      <span id="status">等待加载 IFC…（双击构件可选中）</span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
