<!DOCTYPE html>
<!--
  Netlify Forms 检测文件（勿删）
  Netlify 在部署时解析此静态 HTML 以注册表单。
  实际提交由 React 组件通过 fetch POST 到本路径完成。
  新增/修改表单字段时，务必同步更新此文件中的 <input name="...">。
-->
<html lang="zh-CN">
  <head><meta charset="utf-8" /><title>Forms</title></head>
  <body>
    <!-- 经销商申请 -->
    <form name="dealer-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="dealer-application" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="text" name="city" />
      <input type="tel" name="phone" />
    </form>

    <!-- 保修注册 -->
    <form name="warranty-registration" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="warranty-registration" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="serial" />
      <input type="text" name="model" />
      <input type="date" name="purchaseDate" />
      <input type="text" name="address" />
      <select name="channel"><option>授权经销商门店</option></select>
    </form>
  </body>
</html>
