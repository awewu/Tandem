<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="/favicon.ico">
  <meta name="theme-color" content="#E4002B">
  <title>我的项目进度 - Rhautt Comfort</title>
  <link rel="stylesheet" href="/css/rheem-official-tokens.css">
  <link rel="stylesheet" href="/css/rhautt-comfort-tokens.css">
  <link rel="stylesheet" href="/css/rhautt-operational-surfaces.css">
  <style>
    :root {
      --primary: #0066CC;
      --rheem: var(--rheem-color-red);
      --success: #00875a;
      --warning: #f59e0b;
      --muted: #697386;
      --border: #e3e8ee;
      --bg: #f7f9fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: #1a1f36; min-height: 100vh; }

    .top-bar { background: linear-gradient(135deg, var(--primary), #004d99); color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    .top-bar .brand { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .top-bar .brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; background: rgba(255,255,255,0.2); font-weight: 700; }

    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 56px); padding: 24px; }
    .login-card { background: white; border-radius: 16px; padding: 40px; width: 100%; max-width: 440px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); }
    .login-icon { width: 72px; height: 72px; background: #0d0b09; border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 18px; margin-bottom: 16px; }
    .login-title { font-size: 22px; font-weight: 700; color: #1a1f36; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    .form-row { margin-bottom: 18px; }
    .form-row label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-row input { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; font-size: 15px; transition: border 0.2s; }
    .form-row input:focus { outline: none; border-color: var(--primary); }
    .form-hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .or-divider { text-align: center; margin: 16px 0; color: var(--muted); font-size: 13px; position: relative; }
    .or-divider::before, .or-divider::after { content:''; position: absolute; top:50%; width:42%; height:1px; background: var(--border); }
    .or-divider::before { left:0; } .or-divider::after { right:0; }
    .btn-submit { width:100%; padding:14px; background: var(--primary); color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; transition: all 0.2s; }
    .btn-submit:hover { background: #004d99; transform: translateY(-1px); }
    .demo-hint { background: #f0f7ff; border-radius: 8px; padding: 14px; margin-top: 20px; font-size: 13px; color: var(--muted); }
    .demo-hint summary { cursor: pointer; font-weight: 700; color: var(--rc-neutral-600); }
    .demo-hint b { color: var(--primary); cursor: pointer; }

    /* Portal */
    .portal-wrap { display: none; max-width: 900px; margin: 0 auto; padding: 24px; }
    .portal-header { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .customer-info h2 { font-size: 20px; font-weight: 700; }
    .customer-info p { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .contract-badge { background: #e3fcef; color: var(--success); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }

    /* 当前状态 / 下一步 / 预计（客户可见边界 §5） */
    .lc-status { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; background:white; border-radius:12px; padding:18px 24px; margin-bottom:20px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
    .lc-status .lc-cell { display:flex; flex-direction:column; gap:4px; }
    .lc-status .lc-k { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
    .lc-status .lc-v { font-size:15px; font-weight:700; color:#1a1f36; line-height:1.4; }
    .lc-status .lc-cell.cur .lc-v { color:var(--primary); }
    @media (max-width:640px){ .lc-status { grid-template-columns:1fr; } }

    /* 里程碑时间轴 */
    .timeline-card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .timeline-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .timeline { position: relative; }
    .timeline::before { content:''; position:absolute; left:20px; top:0; bottom:0; width:2px; background: var(--border); }
    .tl-item { display: flex; gap: 16px; margin-bottom: 24px; position: relative; }
    .tl-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; z-index: 1; border: 3px solid white; box-shadow: 0 0 0 2px var(--border); }
    .tl-dot.done { background: var(--success); box-shadow: 0 0 0 2px var(--success); }
    .tl-dot.active { background: var(--primary); box-shadow: 0 0 0 2px var(--primary); animation: pulse 1.5s infinite; }
    .tl-dot.pending { background: #f0f0f0; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 2px var(--primary)} 50%{box-shadow:0 0 0 6px rgba(0,102,204,0.2)} }
    .tl-body { flex: 1; padding-top: 8px; }
    .tl-title { font-size: 14px; font-weight: 600; color: #1a1f36; }
    .tl-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .tl-date { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .tl-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-top: 4px; }
    .tl-badge.done { background: #e3fcef; color: var(--success); }
    .tl-badge.active { background: #e6f0ff; color: var(--primary); }
    .tl-badge.pending { background: #f7f9fc; color: var(--muted); }

    /* 详情卡片网格 */
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .detail-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .detail-card h4 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .label { color: var(--muted); }
    .detail-row .value { font-weight: 500; }
    .detail-row .value.highlight { color: var(--rheem); font-weight: 700; font-size: 15px; }
    .detail-row .value.ok { color: var(--success); }

    .progress-ring { text-align: center; padding: 20px 0; }
    .progress-num { font-size: 48px; font-weight: 700; color: var(--primary); }
    .progress-label { font-size: 13px; color: var(--muted); }
    .progress-bar-wrap { background: var(--border); border-radius: 8px; height: 10px; margin: 16px 0 6px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), #68d391); border-radius: 8px; transition: width 0.8s ease; }

    .action-card { background: linear-gradient(135deg, #f5f7ff, #ebefff); border: 1px solid var(--primary); border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: center; }
    .action-card h3 { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .action-card p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .action-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .action-btn { padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; }
    .action-btn.primary { background: var(--primary); color: white; }
    .action-btn.secondary { background: white; color: var(--primary); border: 1px solid var(--primary); }

    .back-btn { display: inline-block; color: var(--muted); font-size: 13px; cursor: pointer; margin-top: 20px; padding: 8px 0; }
    .back-btn:hover { color: var(--primary); }
  </style>
</head>
<body class="rc-scope rc-customer-passport" data-brand="rheem">

<div class="top-bar">
  <div class="brand">
    <span class="brand-mark">RC</span>
    <span class="rc-brand-stack"><strong>Rhautt Comfort · 客户服务门户</strong><span>Project Passport</span></span>
  </div>
  <div style="font-size:13px;color:var(--rc-neutral-600);font-weight:800">全生命周期项目追踪</div>
</div>

<!-- 登录页 -->
<div class="login-wrap" id="login-section">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:24px">
      <div class="login-icon">RC</div>
      <div class="login-title">项目护照</div>
      <div class="login-sub">输入签约手机号，查看全屋舒适系统的施工、验收与交付状态</div>
    </div>
    <form id="login-form">
      <div class="form-row">
        <label>签约手机号</label>
        <input type="tel" id="inp-phone" placeholder="请输入您的手机号码" maxlength="11" autocomplete="tel">
        <div class="form-hint">签约时留的手机号，用于关联您的项目</div>
      </div>
      <div class="or-divider">或使用客户编号</div>
      <div class="form-row">
        <label>客户编号</label>
        <input type="text" id="inp-cid" placeholder="如: C001、C002..." autocomplete="off">
        <div class="form-hint">销售顾问分配的客户编号</div>
      </div>
      <button type="submit" class="btn-submit">查看我的项目</button>
    </form>
    <details class="demo-hint">
      <summary>内部样例填充</summary>
      <div style="margin-top:10px">
        手机号 <b onclick="document.getElementById('inp-phone').value='13400000000'">13400000000</b>（张业主）
        或客户编号 <b onclick="document.getElementById('inp-cid').value='C001'">C001</b>
      </div>
    </details>
    <div style="text-align:center;margin-top:20px">
      <a href="/login.html" style="color:var(--muted);font-size:13px;text-decoration:none">员工入口</a>
    </div>
  </div>
</div>

<!-- 项目门户 -->
<div class="portal-wrap" id="portal-section">
  <div class="portal-header">
    <div class="customer-info">
      <h2 id="portal-name">—</h2>
      <p id="portal-meta">—</p>
    </div>
    <div>
      <span class="contract-badge" id="portal-status">已签约</span>
    </div>
  </div>

  <!-- 当前状态 / 下一步 / 预计时间（状态机 §5 客户可见） -->
  <div class="lc-status">
    <div class="lc-cell cur"><span class="lc-k">当前状态</span><span class="lc-v" id="lc-current">—</span></div>
    <div class="lc-cell"><span class="lc-k">下一步</span><span class="lc-v" id="lc-next">—</span></div>
    <div class="lc-cell"><span class="lc-k">预计时间</span><span class="lc-v" id="lc-eta">—</span></div>
  </div>

  <!-- 进度概览 -->
  <div class="detail-grid">
    <div class="detail-card" id="card-progress">
      <h4><span class="section-code">PG</span>项目整体进度</h4>
      <div class="progress-ring">
        <div class="progress-num" id="prog-pct">—</div>
        <div class="progress-label">整体完成度</div>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
    </div>
    <div class="detail-card" id="card-contract">
      <h4><span class="section-code">CT</span>合同信息</h4>
      <div id="contract-details-view"></div>
    </div>
    <div class="detail-card" id="card-systems">
      <h4><span class="section-code">SYS</span>我的系统</h4>
      <div id="systems-view"></div>
    </div>
  </div>

  <!-- 项目里程碑 -->
  <div class="timeline-card">
    <h3><span class="section-code">LC</span>项目全生命周期</h3>
    <div class="timeline" id="lifecycle-timeline"></div>
  </div>

  <!-- 下一步行动 -->
  <div class="action-card" id="next-action-card" style="display:none">
    <h3 id="action-title">—</h3>
    <p id="action-desc">—</p>
    <div class="action-btns" id="action-btns"></div>
  </div>

  <div style="text-align:center">
    <span class="back-btn" onclick="showLogin()">退出登录</span>
  </div>
</div>

<script>
  const API = '';
  const DEMO_CUSTOMERS = [
    {
      id: 'C001',
      phone: '13400000000',
      name: '张业主',
      city: '成都',
      houseType: '四室两厅',
      area: 168,
      contractId: 'CNT-DEMO-001',
      createdAt: '2026-06-06T00:00:00.000Z'
    }
  ];
  const DEMO_PROJECT = {
    tenantId: 'demo-tenant',
    customerId: 'C001',
    contractId: 'CNT-DEMO-001',
    projectAddress: '成都高新区',
    projectState: 'construction-in-progress',
    customerVisibleState: '正在施工',
    progressPercent: 76,
    currentMilestone: 'site-installation',
    lifecycleStage: 'installing',
    handoverStatus: 'pending',
    references: {
      quoteId: 'QUOTE-DEMO-001',
      designPackageId: 'DESIGN-DEMO-001',
      rysnova-bimPackageId: 'RYSNOVA-DEMO-001',
      customerReportUrl: '/customer-share.html'
    },
    solution: {
      systems: ['中央热水', '采暖', '新风', '全屋净水', '智能控制'],
      equipmentBrands: ['Rheem', 'Ruud', 'Everhot']
    },
    quotation: { quoteId: 'QUOTE-DEMO-001', status: 'linked' },
    construction: { state: 'active', currentMilestone: 'site-installation', progressPercent: 76 },
    acceptance: { status: 'not-started' },
    servicePlan: { planId: 'PLAN-DEMO-001', status: 'prepared', warrantyMonths: 60, maintenanceCadence: 'quarterly', sla: '24h_response_48h_onsite' },
    installedAssets: [
      { assetId: 'asset-demo-wh', brand: 'Rheem', category: 'central-hot-water', name: '中央热水主机', status: 'installed' },
      { assetId: 'asset-demo-ctrl', brand: 'Ruud', category: 'smart-control', name: '智能控制网关', status: 'bound' },
      { assetId: 'asset-demo-water', brand: 'Everhot', category: 'water-treatment', name: '中央净水', status: 'installed' }
    ],
    iot: {
      homeId: 'home-demo-001',
      bindingStatus: 'prepared',
      handoverStatus: 'pending',
      handoffBoundary: 'lifecycle_handoff_only',
      capabilityRegistry: [
        { assetId: 'asset-demo-wh', category: 'central-hot-water', bindingStatus: 'prepared', controlBoundary: 'lifecycle_handoff_only' },
        { assetId: 'asset-demo-ctrl', category: 'smart-control', bindingStatus: 'bound', controlBoundary: 'lifecycle_handoff_only' }
      ]
    },
    milestones: [
      { state: 'diagnosis-in-progress', label: '需求诊断', description: '瑞诺瓦 AI 问诊形成需求画像', status: 'done', progressPercent: 12 },
      { state: 'solution-drafted', label: '方案生成', description: '完成舒适家系统方案', status: 'done', progressPercent: 20 },
      { state: 'quote-approved', label: '报价确认', description: '完成报价和方案确认', status: 'done', progressPercent: 50 },
      { state: 'construction-planning', label: '施工准备', description: '完成材料、图纸和排期', status: 'done', progressPercent: 66 },
      { state: 'construction-in-progress', label: '施工安装', description: '按深化图纸推进安装', status: 'active', progressPercent: 76 },
      { state: 'acceptance-pending', label: '调试验收', description: '等待系统调试和验收', status: 'pending', progressPercent: 88 },
      { state: 'lifecycle-handoff-ready', label: '服务交接', description: '准备设备资产、保修和 IoT 生命周期衔接', status: 'pending', progressPercent: 96 },
      { state: 'lifecycle-active', label: '长期呵护', description: '进入全生命周期服务周期', status: 'pending', progressPercent: 100 }
    ],
    nextAction: {
      title: '当前阶段：施工安装中',
      description: '您的项目正在按计划推进，如有疑问可联系专属顾问',
      actionType: 'track-construction',
      href: '/customer-share.html',
      visibility: 'customer-visible'
    },
    visibility: {
      scope: 'customer-visible',
      hiddenFields: ['dealerMargin', 'costBaseline', 'internalApprovalNotes', 'crossTenantData', 'sensitiveTechnicianNotes']
    },
    handoffBoundary: 'lifecycle_handoff_only'
  };

  // ─── 闭环状态机（权威顺序·同 docs/RHAUTT-NEXUS-CUSTOMER-LIFECYCLE-STATE-MODEL.md §2） ───
  const LIFECYCLE_STATES = [
    { state:'lead-created',            label:'已收到需求',            next:'diagnosis-in-progress' },
    { state:'diagnosis-in-progress',   label:'正在生成需求画像',        next:'solution-drafted' },
    { state:'solution-drafted',        label:'方案初稿已生成',          next:'design-in-progress' },
    { state:'design-in-progress',      label:'设计师正在深化方案',      next:'quote-drafted' },
    { state:'quote-drafted',           label:'报价草案已生成',          next:'quote-approved' },
    { state:'quote-approved',          label:'报价已审核，可确认',      next:'contract-pending' },
    { state:'contract-pending',        label:'合同待确认',            next:'construction-planning' },
    { state:'construction-planning',   label:'施工计划制定中',          next:'construction-in-progress' },
    { state:'construction-in-progress',label:'正在施工',              next:'acceptance-pending' },
    { state:'acceptance-pending',      label:'待验收',                next:'accepted' },
    { state:'accepted',                label:'项目已验收',            next:'lifecycle-handoff-ready' },
    { state:'lifecycle-handoff-ready', label:'正在准备全生命周期服务',  next:'lifecycle-active' },
    { state:'lifecycle-active',        label:'已进入舒适家服务周期',    next:'service-event-open' },
    { state:'service-event-open',      label:'服务处理中',            next:'lifecycle-active' }
  ];

  function lifecycleInfo(project) {
    const currentState = project.state || project.projectState;
    const idx = LIFECYCLE_STATES.findIndex(s => s.state === currentState);
    const cur = idx >= 0 ? LIFECYCLE_STATES[idx] : null;
    const curLabel = project.customerVisibleState || cur?.label || project.projectState || '项目进行中';
    const nextLabel = cur?.next ? (LIFECYCLE_STATES.find(s => s.state === cur.next)?.label || '—') : '—';
    const eta = (project.estimatedNextAt || project.nextAction?.eta || '').slice(0,10) || '待顾问确认';
    return { curLabel, nextLabel, eta };
  }

  // 仅有 state、无 milestones 时，按权威状态机派生客户可见时间轴
  function canonicalMilestones(currentState) {
    const curIdx = LIFECYCLE_STATES.findIndex(s => s.state === currentState);
    return LIFECYCLE_STATES.filter(s => s.state !== 'service-event-open').map((s, i) => ({
      state: s.state,
      label: s.label,
      description: '',
      status: curIdx < 0 ? 'pending' : i < curIdx ? 'done' : i === curIdx ? 'active' : 'pending'
    }));
  }

  // ─── 登录 ───
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const phone = document.getElementById('inp-phone').value.trim();
    const cid = document.getElementById('inp-cid').value.trim();
    if (!phone && !cid) { alert('请输入手机号或客户编号'); return; }

    try {
      const customer = findDemoCustomer(phone, cid);
      if (!customer) { alert('未找到您的账户，请检查手机号或客户编号'); return; }
      await loadPortal(customer);
    } catch (err) {
      alert('查询失败：' + err.message);
    }
  });

  async function loadPortal(customer) {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('portal-section').style.display = 'block';

    const project = await loadCustomerProject(customer);
    renderProject(customer, project);
  }

  function findDemoCustomer(phone, cid) {
    return DEMO_CUSTOMERS.find(c => (phone && c.phone === phone) || (cid && c.id === cid)) || null;
  }

  function getAuthToken() {
    return localStorage.getItem('token') || '';
  }

  function getStoredUser() {
    try { return JSON.parse(localStorage.getItem('user') || 'null'); } catch (_) { return null; }
  }

  function getRequestedContractId(customer) {
    const params = new URLSearchParams(window.location.search);
    return params.get('contractId') || customer.contractId || getStoredUser()?.contractId || null;
  }

  async function fetchV2Json(path) {
    const token = getAuthToken();
    if (!token) return null;
    const response = await fetch(path, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!response.ok) return null;
    const json = await response.json();
    return json.success ? json.data : null;
  }

  async function loadCustomerProject(customer) {
    const contractId = getRequestedContractId(customer);
    if (contractId) {
      const detail = await fetchV2Json(`/api/v2/lifecycle/customer-projects/${encodeURIComponent(contractId)}`);
      if (detail) return detail;
    }

    const list = await fetchV2Json('/api/v2/lifecycle/customer-projects');
    if (list && Array.isArray(list.items) && list.items.length) return list.items[0];

    return {
      ...DEMO_PROJECT,
      customerId: customer.id,
      contractId: contractId || DEMO_PROJECT.contractId
    };
  }

  function renderProject(customer, project) {
    const systems = project.solution?.systems || [];
    const brands = project.solution?.equipmentBrands || [];
    const servicePlan = project.servicePlan || {};
    const quotation = project.quotation || {};
    const acceptance = project.acceptance || {};
    const iot = project.iot || {};

    document.getElementById('portal-name').textContent = `${customer.name || '客户'} 的项目`;
    document.getElementById('portal-meta').textContent = [
      customer.city,
      customer.houseType,
      customer.area ? `${customer.area}㎡` : null,
      project.projectAddress
    ].filter(Boolean).join(' · ') || project.contractId;

    document.getElementById('portal-status').textContent = project.customerVisibleState || '项目进行中';

    const lc = lifecycleInfo(project);
    document.getElementById('lc-current').textContent = lc.curLabel;
    document.getElementById('lc-next').textContent = lc.nextLabel;
    document.getElementById('lc-eta').textContent = lc.eta;
    document.getElementById('contract-details-view').innerHTML = `
      <div class="detail-row"><span class="label">合同编号</span><span class="value">${project.contractId || '—'}</span></div>
      <div class="detail-row"><span class="label">报价单</span><span class="value">${quotation.quoteId || project.references?.quoteId || '待关联'}</span></div>
      <div class="detail-row"><span class="label">报价状态</span><span class="value">${quotation.status || '—'}</span></div>
      <div class="detail-row"><span class="label">当前阶段</span><span class="value">${project.customerVisibleState || project.projectState || '—'}</span></div>
      <div class="detail-row"><span class="label">验收状态</span><span class="value">${acceptance.status || '—'}</span></div>`;

    document.getElementById('systems-view').innerHTML = systems.map(s =>
      `<div class="detail-row"><span class="label">${s}</span><span class="value ok">已规划</span></div>`
    ).join('');
    if (!systems.length) {
      document.getElementById('systems-view').innerHTML = brands.map(b =>
        `<div class="detail-row"><span class="label">${b}</span><span class="value ok">设备品牌</span></div>`
      ).join('') || '<div class="detail-row"><span class="label">系统方案</span><span class="value">待深化</span></div>';
    }

    const pct = Number(project.progressPercent || project.construction?.progressPercent || 0);
    document.getElementById('prog-pct').textContent = pct + '%';
    document.getElementById('prog-bar').style.width = pct + '%';

    buildTimeline(project, customer);
    renderAction(project, servicePlan, iot);
  }

  function buildTimeline(project, customer) {
    const createdAt = customer.createdAt ? customer.createdAt.slice(0,10) : '—';
    const source = (project.milestones && project.milestones.length)
      ? project.milestones
      : ((project.state || project.projectState) ? canonicalMilestones(project.state || project.projectState) : DEMO_PROJECT.milestones);
    const stages = source
      .map((stage, index) => ({
        icon: String(index + 1).padStart(2, '0'),
        label: stage.label,
        desc: stage.description || stage.customerVisibleState || '',
        date: stage.status === 'active' ? '进行中' : stage.status === 'pending' ? '待启动' : createdAt,
        status: stage.status || 'pending'
      }));

    document.getElementById('lifecycle-timeline').innerHTML = stages.map(s => `
      <div class="tl-item">
        <div class="tl-dot ${s.status}">${s.icon}</div>
        <div class="tl-body">
          <div class="tl-title">${s.label}</div>
          <div class="tl-desc">${s.desc}</div>
          <div class="tl-date">${s.date}</div>
          <span class="tl-badge ${s.status}">${s.status==='done'?'已完成':s.status==='active'?'进行中':'待启动'}</span>
        </div>
      </div>`).join('');
  }

  function renderAction(project, servicePlan, iot) {
    const next = project.nextAction || {};
    const reportUrl = project.references?.customerReportUrl || '/customer-share.html';
    const primaryHref = next.href || reportUrl;
    const serviceText = servicePlan?.status ? `服务计划：${servicePlan.status}` : '服务计划待准备';
    const iotText = iot?.handoffBoundary === 'lifecycle_handoff_only' ? 'IoT 生命周期衔接已限定为 handoff' : 'IoT 衔接待准备';
    document.getElementById('next-action-card').style.display = 'block';
    document.getElementById('action-title').textContent = next.title || `当前阶段：${project.customerVisibleState || '项目进行中'}`;
    document.getElementById('action-desc').textContent = `${next.description || '您的项目正在按计划推进。'} · ${serviceText} · ${iotText}`;
    document.getElementById('action-btns').innerHTML = `
      <a class="action-btn primary" href="${primaryHref}">查看舒适方案</a>
      <a class="action-btn secondary" href="/pain-diagnosis.html">提交新需求</a>`;
  }

  function showLogin() {
    document.getElementById('portal-section').style.display = 'none';
    document.getElementById('login-section').style.display = 'flex';
  }
</script>
</body>
</html>
