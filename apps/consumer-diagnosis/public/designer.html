<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="/favicon.ico">
<title>设计师工作台 · Rhautt Comfort 全屋舒适系统平面交互体系 | 瑞合瑞德暖通科技</title>
<link rel="stylesheet" href="/css/rheem-official-tokens.css">
<link rel="stylesheet" href="/css/rhautt-comfort-tokens.css">
<link rel="stylesheet" href="/css/rhautt-operational-surfaces.css">
<script src="/js/konva-lite.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root {--rysnova-blue:#0066CC;--rysnova-blue-light:#3399FF;--gold-light:#D4A945;--bg:#0f1117;--surface:#181b23;--card:#1e2130;--border:rgba(255,255,255,0.06);--border-h:rgba(255,255,255,0.14);--text:rgba(255,255,255,0.92);--text-2:rgba(255,255,255,0.55);--text-3:rgba(255,255,255,0.35);--red:#ef4444}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit}
.topbar{height:44px;padding:0 18px;display:flex;align-items:center;gap:16px;background:rgba(15,17,23,0.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.tb-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.tb-brand img{height:30px;filter:brightness(1.2)}
.tb-tag{padding:3px 10px;font-size:10.5px;font-weight:700;letter-spacing:1.5px;color:var(--gold-light);border:1px solid rgba(212,169,69,0.35);border-radius:999px}
.tb-div{width:1px;height:18px;background:var(--border)}
.tb-ctx{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.tb-ctx-sub{color:var(--text-3);font-size:12px;font-weight:500}
.tb-nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.tb-nav a{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,0.65);text-decoration:none;transition:all .2s}
.tb-nav a:hover{background:rgba(255,255,255,0.08);color:#fff}
.tb-nav a.is-cta{background:var(--rysnova-blue);color:#fff!important}
.tb-nav a.is-cta:hover{background:var(--rysnova-blue-light)}
.ws{display:grid;grid-template-columns:60px 240px 1fr 340px;height:calc(100vh - 44px)}
.ws-rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;padding:10px 8px;align-items:center}
.ws-rail button{width:44px;height:44px;border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ws-rail button:hover{color:var(--text);border-color:var(--border-h)}
.ws-rail button.active{background:var(--rysnova-blue);color:#fff;border-color:var(--rysnova-blue-light);box-shadow:0 0 0 3px rgba(0,102,204,.18)}
.ws-rail hr{width:28px;border:none;height:1px;background:var(--border);margin:6px 0}
.ws-lib{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.lib-tabs{display:flex;padding:10px 10px 0;gap:4px}
.lib-tabs button{flex:1;padding:7px 0;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:8px;cursor:pointer;transition:all .15s}
.lib-tabs button:hover{color:var(--text)}
.lib-tabs button.active{color:var(--gold-light);border-color:rgba(212,169,69,.4);background:rgba(212,169,69,.06)}
.lib-list{flex:1;overflow-y:auto;padding:10px}
.lib-list::-webkit-scrollbar{width:4px}
.lib-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
.lib-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);background:var(--card);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.lib-item:hover{border-color:var(--rysnova-blue);transform:translateX(2px)}
.lib-item.active{border-color:var(--rysnova-blue);background:rgba(0,102,204,.12);box-shadow:0 0 0 2px rgba(0,102,204,.2)}
.li-icon{width:32px;height:32px;border-radius:8px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.li-info{flex:1;min-width:0}
.li-name{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-meta{font-size:11px;color:var(--text-3);margin-top:2px}
.ws-canvas{display:flex;flex-direction:column;min-width:0;min-height:0}
.ct{height:44px;padding:0 14px;flex-shrink:0;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--border)}
.ct-mode{padding:4px 12px;background:rgba(0,102,204,.18);color:var(--rysnova-blue-light);font-size:12px;font-weight:700;border-radius:999px;white-space:nowrap}
.ct-name{flex:1;min-width:100px;max-width:280px;padding:6px 10px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:13px;outline:none;font-weight:600}
.ct-name:focus{border-color:var(--rysnova-blue)}
.ct-btn{padding:7px 12px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap}
.ct-btn:hover{border-color:var(--border-h);background:rgba(255,255,255,.05)}
.ct-btn.is-primary{background:linear-gradient(135deg,var(--rysnova-blue),var(--rysnova-blue-light));border-color:var(--rysnova-blue);color:#fff}
.ct-btn.is-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,102,204,.4)}
.stage-wrap{flex:1;position:relative;background:#0a0c12;min-height:0;overflow:hidden}
#konvaContainer{width:100%;height:100%}
.status{height:28px;padding:0 14px;flex-shrink:0;display:flex;align-items:center;gap:18px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}
.status strong{color:var(--text-2);font-weight:600}
.ws-insp{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;min-height:0}
.ws-insp::-webkit-scrollbar{width:4px}
.ws-insp::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
.insp-sec{padding:14px 16px;border-bottom:1px solid var(--border)}
.insp-h{font-size:11.5px;font-weight:700;color:var(--gold-light);letter-spacing:1px;margin-bottom:12px}
.insp-empty{color:var(--text-3);font-size:12px;text-align:center;padding:14px 8px;line-height:1.6}
.prop-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.prop-row label{width:56px;color:var(--text-2);flex-shrink:0}
.prop-row input{flex:1;min-width:0;padding:6px 8px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:12px;outline:none}
.prop-row input:focus{border-color:var(--rysnova-blue)}
.bom{width:100%;font-size:11.5px;border-collapse:collapse}
.bom th{color:var(--text-3);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--border)}
.bom th:nth-child(n+2){text-align:right}
.bom td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--text-2)}
.bom td:nth-child(2),.bom td:nth-child(3){text-align:right}
.bom td:last-child{color:var(--gold-light);font-weight:700;text-align:right}
.bom .empty td{color:var(--text-3);text-align:center;padding:18px}
.qs-line{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:12.5px;color:var(--text-2)}
.qs-line strong{color:var(--text)}
.qs-total{padding:10px 0 4px;border-top:1px solid var(--border);margin-top:6px}
.qs-total span{font-size:13px}
.qs-total strong{color:var(--gold-light);font-size:18px;font-weight:800}
.qs-monthly{font-size:11px;color:var(--text-3);margin-top:6px;text-align:right}
.insp-actions{display:flex;gap:6px;margin-top:10px}
.insp-actions button{flex:1;padding:7px;font-size:11.5px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;transition:all .15s}
.insp-actions button:hover{border-color:var(--border-h)}
.insp-actions .btn-danger{color:var(--red);border-color:rgba(239,68,68,.3)}
.insp-actions .btn-danger:hover{background:rgba(239,68,68,.1)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;background:rgba(30,33,48,.96);border:1px solid var(--border);border-radius:999px;font-size:13px;color:var(--text);z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:20px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal-bg.show{display:flex}
.modal{background:#fff;color:#1a1a1a;width:720px;max-width:100%;max-height:88vh;overflow:auto;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-h{padding:22px 28px;color:#fff;background:linear-gradient(135deg,#0066CC,#3399FF);border-radius:16px 16px 0 0}
.modal-h h3{margin:0;font-size:20px;font-weight:800}
.modal-h p{margin:6px 0 0;font-size:13px;opacity:.92}
.modal-b{padding:22px 28px}
.m-tbl{width:100%;border-collapse:collapse;font-size:13px}
.m-tbl th{background:#f3f4f6;padding:10px;text-align:left;font-weight:700;color:#1f2937}
.m-tbl td{padding:10px;border-bottom:1px solid #e5e7eb;color:#374151}
.m-tbl tr.subtotal td{font-weight:700;background:#fafafa;color:#111827}
.m-tbl tr.grand td{font-weight:800;font-size:15px;background:linear-gradient(90deg,#fef3c7,#fde68a);color:#92400e}
.deal-loop{margin-top:16px;border:1px solid #d8dee8;border-radius:10px;overflow:hidden;background:#fff}
.deal-loop-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px 16px;background:#f8fafc;border-bottom:1px solid #e5e7eb}
.deal-loop-title{font-size:13px;font-weight:800;color:#111827}
.deal-loop-sub{margin-top:3px;font-size:12px;color:#64748b;line-height:1.5}
.deal-loop-badge{flex:0 0 auto;padding:4px 9px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:11px;font-weight:800}
.deal-loop-body{padding:14px 16px}
.deal-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deal-field{display:flex;flex-direction:column;gap:5px}
.deal-field label{font-size:11px;font-weight:800;color:#475569}
.deal-field input,.deal-field select{height:34px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;font-size:12px;color:#0f172a;background:#fff;outline:none}
.deal-field input:focus,.deal-field select:focus{border-color:#0066CC;box-shadow:0 0 0 3px rgba(0,102,204,.12)}
.deal-field.is-wide{grid-column:1/-1}
.deal-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.deal-step{min-height:74px;padding:10px;border:1px solid #e2e8f0;border-radius:9px;background:#fff;display:flex;flex-direction:column;gap:6px}
.deal-step strong{font-size:12px;color:#111827}
.deal-step span{font-size:11px;line-height:1.45;color:#64748b}
.deal-step.done{border-color:#16a34a;background:#f0fdf4}
.deal-step.active{border-color:#0066CC;background:#eff6ff}
.deal-step.blocked{border-color:#f59e0b;background:#fffbeb}
.deal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.deal-actions button{border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:8px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}
.deal-actions button:hover{background:#f8fafc}
.deal-actions button.is-primary{background:#0066CC;border-color:#0066CC;color:#fff}
.deal-actions button:disabled{opacity:.48;cursor:not-allowed}
.deal-status{margin-top:12px;padding:10px 12px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;color:#334155;font-size:12px;line-height:1.55;white-space:pre-line}
.deal-status.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.deal-status.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.deal-status.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.modal-actions{padding:16px 28px;background:#fafafa;border-radius:0 0 16px 16px;display:flex;gap:10px;justify-content:flex-end}
.modal-actions button{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #d1d5db;background:#fff;color:#1f2937}
.modal-actions button:hover{background:#f3f4f6}
.modal-actions .is-primary{background:var(--rysnova-blue);border-color:var(--rysnova-blue);color:#fff}
.modal-actions .is-primary:hover{background:var(--rysnova-blue-light)}
@media(max-width:1200px){.ws{grid-template-columns:56px 200px minmax(420px,1fr) 300px}}
@media(max-width:780px){.deal-form{grid-template-columns:1fr}.deal-steps{grid-template-columns:1fr 1fr}}
@media(max-width:1040px){
  body{overflow:hidden}
  .tb-nav a:not(.is-cta){display:none}
  .tb-ctx-sub{display:none}
  .ws{grid-template-columns:56px 200px minmax(420px,1fr)}
  .ws-insp{display:none}
  .ct{overflow-x:auto}
  .ct-name{max-width:180px}
  .stage-wrap{min-width:420px}
}
@media(max-width:720px){
  .topbar{padding:0 10px;gap:8px}
  .tb-brand img{height:26px}
  .tb-tag{font-size:10px;padding:3px 8px}
  .tb-ctx{display:none}
  .ws{grid-template-columns:52px minmax(360px,1fr)}
  .ws-lib{display:none}
  .ws-rail{padding:8px 6px}
  .ws-rail button{width:40px;height:40px;font-size:14px}
  .stage-wrap{min-width:360px}
}
</style>
</head>
<body class="rc-scope rc-design-studio" data-rc-theme="dark" data-brand="rheem">
<header class="topbar">
  <a href="/" class="tb-brand"><img src="/images/rhautt-comfort-wordmark.svg" alt="Rhautt Comfort"><span class="tb-tag">设计师工作台</span></a>
  <span class="tb-div"></span>
  <div class="tb-ctx">Rhautt Comfort 全屋舒适系统<span class="tb-ctx-sub">· 平面交互体系 · 房型 / 设备 / 管路 / 材料 / 报价</span></div>
  <nav class="tb-nav">
    <a href="/">首页</a>
    <a href="/pain-diagnosis.html">需求诊断</a>
    <a href="/business-console.html#tab-quote" class="is-cta">报价 · 促销</a>
    <a href="/customer-share.html?quoteId=demo" target="_blank" class="is-cta">客户分享</a>
    <a href="/rysnova-bim-designer.html">Rysnova BIM</a>
    <a href="/staff-portal.html">员工中心</a>
  </nav>
</header>

<div class="ws">
  <aside class="ws-rail">
    <button data-tool="select" class="active" title="选择 (V)">V</button>
    <button data-tool="wall" title="画墙 (W)">▭</button>
    <button data-tool="door" title="加门 (D)">DR</button>
    <button data-tool="window" title="加窗 (N)">▤</button>
    <button data-tool="device" title="放设备 (E)">EQ</button>
    <button data-tool="pipe" title="画管路 (P)">⫯</button>
    <button data-tool="text" title="加文字 (T)">T</button>
    <hr>
    <button data-action="undo" title="撤销 Ctrl+Z">↶</button>
    <button data-action="redo" title="重做 Ctrl+Y">↷</button>
    <button data-action="delete" title="删除 Del">DEL</button>
    <hr>
    <button data-action="zoom-in" title="放大">＋</button>
    <button data-action="zoom-out" title="缩小">−</button>
    <button data-action="zoom-fit" title="适应">FIT</button>
  </aside>

  <aside class="ws-lib">
    <div class="lib-tabs">
      <button data-cat="device" class="active">设备</button>
      <button data-cat="pipe">管路</button>
      <button data-cat="layout">布局</button>
    </div>
    <div class="lib-list" id="libList"></div>
  </aside>

  <main class="ws-canvas">
    <div class="ct">
      <span class="ct-mode" id="modeIndicator">选择模式</span>
      <input class="ct-name" id="projectName" placeholder="项目名称" value="未命名项目">
      <button class="ct-btn" onclick="exportPNG()">导出 PNG</button>
      <button class="ct-btn" onclick="exportJSON()">保存方案</button>
      <button class="ct-btn" onclick="loadJSON()">载入方案</button>
      <button class="ct-btn is-primary" onclick="generateQuote()">生成客户报价</button>
    </div>
    <div class="stage-wrap"><div id="konvaContainer"></div></div>
    <div class="status">
      <span>坐标: <strong id="coords">0, 0</strong></span>
      <span>网格: <strong>50px = 1m</strong></span>
      <span>缩放: <strong id="zoomLevel">100%</strong></span>
      <span>对象: <strong id="objCount">0</strong></span>
      <span style="margin-left:auto" id="autoSaveHint">自动保存已开启</span>
    </div>
  </main>

  <aside class="ws-insp">
    <div class="insp-sec">
      <div class="insp-h">▾ 对象属性</div>
      <div id="propsPanel"><div class="insp-empty">未选中对象<br>选择工具 V · 点击对象</div></div>
    </div>
    <div class="insp-sec">
      <div class="insp-h">实时材料清单</div>
      <table class="bom" id="bomTable">
        <thead><tr><th>项目</th><th>数量</th><th>单价</th><th>小计</th></tr></thead>
        <tbody><tr class="empty"><td colspan="4">暂无设备 / 管路</td></tr></tbody>
      </table>
    </div>
    <div class="insp-sec">
      <div class="insp-h">实时报价</div>
      <div id="quoteSummary"><div class="insp-empty">添加设备后自动估算</div></div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="quoteModal" onclick="if(event.target===this)closeQuote()">
  <div class="modal">
    <div class="modal-h">
      <h3 id="qmTitle">客户报价单</h3>
      <p>瑞合瑞德暖通科技 · 基于设计师方案自动生成 · <span id="qmDate"></span></p>
    </div>
    <div class="modal-b" id="qmBody"></div>
    <div class="modal-actions">
      <button onclick="closeQuote()">关闭</button>
      <button onclick="window.print()">打印</button>
      <button class="is-primary" onclick="window.print()">导出 PDF</button>
    </div>
  </div>
</div>

'use strict';

/* ============= Catalog ============= */
const DEVICE_CATALOG = [
  { id:'heatpump-l',  name:'空气源热泵·大', icon:'HP-L', w:80, h:50, color:'#E4002B', price:38000, unit:'台' },

  { id:'ahu',         name:'新风主机',       icon:'AHU',w:65, h:35, color:'#007681', price:12000, unit:'台' },

  { id:'manifold',    name:'分集水器',       icon:'MF', w:32, h:18, color:'#0ea5e9', price:2200,  unit:'组' },
];
const PIPE_CATALOG = [
  { id:'water-supply',    name:'冷热水管 PPR DN25', color:'#0066CC', priceM:85,  unit:'m', dash:false },
  { id:'water-return',    name:'回水管 PPR DN25',   color:'#3399FF', priceM:85,  unit:'m', dash:true  },

const dist = (a,b,c,d) => Math.hypot(c-a, d-b);
function pipeLenPx(pts){ let L=0; for(let i=0;i<pts.length-2;i+=2) L+=dist(pts[i],pts[i+1],pts[i+2],pts[i+3]); return L; }
function pointerPos(){ const p = stage.getRelativePointerPosition(); return p || {x:0,y:0}; }

function mapSystemFamily(item = {}){
  const text = `${item.id || ''} ${item.name || ''} ${item.category || ''}`;
  if (/热水|water-heater|DHW|冷热水/i.test(text)) return 'hot_water';
  if (/采暖|地暖|散热器|壁挂炉|underfloor|radiator|boiler|heating/i.test(text)) return 'heating';
  if (/新风|风管|风口|AHU|VENT|air-duct|fresh/i.test(text)) return 'fresh_air';
  if (/空调|FCU|冷媒|refrig|fcu|air/i.test(text)) return 'air';
  if (/净水|water_treatment|filter/i.test(text)) return 'water_treatment';
  if (/智能|温控|thermostat|control/i.test(text)) return 'smart_control';
  return 'other';
}
function deriveSystemFamilies(items = latestBOMItems){
  const families = [...new Set((items || []).map(mapSystemFamily))].filter(Boolean);
  return families.length ? families : ['other'];
}
function normalizeQuoteForContract(quote, items = latestBOMItems){
  const summary = quote?.summary || {};
  const costItems = Array.isArray(quote?.costBreakdown) ? quote.costBreakdown : [
    { code:'materials', name:'设备/管路材料', amount:summary.materialSubtotal || 0 },
    { code:'labor', name:'安装人工', amount:summary.labor || summary.laborSubtotal || 0 },
    { code:'auxiliary', name:'辅材与损耗', amount:summary.auxiliary || 0 },
    { code:'management', name:'项目管理与质检', amount:summary.management || summary.managementFee || 0 },
    { code:'risk', name:'施工风险预备', amount:summary.riskReserve || 0 }
  ];
  const pricing = {
    materialSubtotal: summary.materialSubtotal || 0,
    labor: summary.labor || summary.laborSubtotal || 0,
    auxiliary: summary.auxiliary || 0,
    management: summary.management || summary.managementFee || 0,
    riskReserve: summary.riskReserve || 0,
    directCost: summary.directCost || 0,
    tax: summary.tax || summary.taxAmount || 0,
    customerTotal: summary.customerTotal || summary.finalTotal || summary.total || summary.totalAmount || 0,
    dealerMargin: summary.dealerMargin || 0,
    monthlyPayment: summary.monthlyPayment || 0
  };
  return {
    quoteId: quote?.quoteId || `designer-${Date.now()}`,
    quotationNo: quote?.quotationNo || quote?.quoteId || `DQ-${Date.now()}`,
    revision: quote?.revision || 1,
    source: quote?.source || 'designer-bom',
    currency: quote?.currency || 'CNY',
    project: getProjectMeta(items),
    systemFamilies: deriveSystemFamilies(items),
    items: (items || []).map(i => ({
      itemId: i.id,
      id: i.id,
      name: i.name,
      category: i.category,
      quantity: i.qty,
      qty: i.qty,
      unit: i.unit,
      unitPrice: i.unitPrice,
      total: i.total,
      systemFamily: mapSystemFamily(i),
      source: 'designer_bom'
    })),
    summary: pricing,
    costBreakdown: pricing,
    costItems,
    marginGuard: quote?.marginGuard || { status:'not_checked' },
    deliverables: quote?.deliverables || {},
    lifecycleHandoff: {
      required: true,
      handoffBoundary: 'lifecycle_handoff_only',
      servicePlanCode: 'comfort-lifecycle-standard'
    },
    assumptions: quote?.assumptions || []
  };
}

async function persistWorkspaceState(){
  const token = getAuthToken();
  if (!token) return { saved:false, reason:'missing-token' };
  const res = await fetch('/api/v2/design/projects/' + encodeURIComponent(workspaceProjectId) + '/workspace-state', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      Authorization:'Bearer ' + token
    },
    body:JSON.stringify(buildWorkspaceStatePayload())
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.success === false) throw new Error(json.error || '设计工作台保存服务暂不可用');
  return json.data;
}
function scheduleWorkspacePersist(){
  clearTimeout(workspaceSaveTimer);
  workspaceSaveTimer = setTimeout(async () => {
    if (workspaceSaveInFlight) {
      workspaceSaveDirty = true;
      return;
    }
    workspaceSaveInFlight = true;
    workspaceSaveDirty = false;
    try {
      const saved = await persistWorkspaceState();
      if (saved && saved.reason !== 'missing-token') {
        document.getElementById('autoSaveHint').textContent = '已保存到工作台 · v' + (saved.version || 1);
      }
    } catch (error) {
      document.getElementById('autoSaveHint').textContent = '本地保存 · 后端待同步';
    } finally {
      workspaceSaveInFlight = false;
      if (workspaceSaveDirty) scheduleWorkspacePersist();
    }
  }, 800);
}
async function contractApi(path, options = {}){
  const token = getAuthToken();
  if (!token) {
    const err = new Error('请先登录员工 / 设计师账号，再创建合同闭环。');
    err.status = 401;
    throw err;
  }
  const res = await fetch(path, {
    method: options.method || 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${token}`
    },
    body: JSON.stringify(options.body || {})
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.success === false) {
    const err = new Error(json.error || json.message || '合同服务暂不可用');
    err.status = res.status;
    throw err;
  }
  return json.data;
}
function recordId(record = {}){
  return record._id || record.id || record.quotationId || '';
}
async function persistQuotationFromQuote(customerId, quote, items, projectMeta){
  const normalizedQuote = normalizeQuoteForContract(quote, items);
  const data = await contractApi('/api/quotation-v2/persist-from-bom', {
    method:'POST',
    body: {
      customerId,
      quote: normalizedQuote,
      items: normalizedQuote.items,
      project: projectMeta || normalizedQuote.project,
      systemFamilies: normalizedQuote.systemFamilies,
      lifecycleHandoff: {
        required: true,
        status: 'ready',
        servicePlanCode: 'comfort-lifecycle-standard',
        handoffBoundary: 'lifecycle_handoff_only'
      }
    }
  });
  const quotationId = recordId(data.quotation);
  if (!quotationId) {
    const err = new Error('报价已请求保存，但后端未返回 quotationId，不能创建生产合同。');
    err.status = 500;
    throw err;
  }
  return {
    quotationId,
    quotationNo: data.quotation?.quotationNo,
    quote: data.quote || normalizedQuote,
    normalizedQuote
  };
}

function drawGrid(){
  layers.grid.destroyChildren();
  const w = stage.width(), h = stage.height();
  layers.grid.add(new Konva.Rect({ x:0, y:0, width:w, height:h, fill:'#0a0c12' }));
  // minor lines: 0.5m
  for(let x=0; x<w; x+=25) layers.grid.add(new Konva.Line({ points:[x,0,x,h], stroke:'rgba(255,255,255,0.025)', strokeWidth:1 }));
  for(let y=0; y<h; y+=25) layers.grid.add(new Konva.Line({ points:[0,y,w,y], stroke:'rgba(255,255,255,0.025)', strokeWidth:1 }));
  // major: 1m
  for(let x=0; x<w; x+=50) layers.grid.add(new Konva.Line({ points:[x,0,x,h], stroke:'rgba(255,255,255,0.07)', strokeWidth:1 }));
  for(let y=0; y<h; y+=50) layers.grid.add(new Konva.Line({ points:[0,y,w,y], stroke:'rgba(255,255,255,0.07)', strokeWidth:1 }));
  // axes
  layers.grid.add(new Konva.Line({ points:[0, h/2, w, h/2], stroke:'rgba(0,102,204,0.25)', strokeWidth:1 }));
  layers.grid.add(new Konva.Line({ points:[w/2, 0, w/2, h], stroke:'rgba(0,102,204,0.25)', strokeWidth:1 }));
  layers.grid.batchDraw();
}

/* ============= History (undo/redo) ============= */
const history = { stack:[], pointer:-1, suppress:false };
function snapshot(){
  if (history.suppress) return;
  history.stack = history.stack.slice(0, history.pointer + 1);
  history.stack.push(JSON.parse(JSON.stringify(project)));
  history.pointer++;
  if (history.stack.length > 50) { history.stack.shift(); history.pointer--; }
  autoSave();
}
function undo(){ if (history.pointer<=0) return; history.pointer--; restore(history.stack[history.pointer]); showToast('已撤销'); }
function redo(){ if (history.pointer>=history.stack.length-1) return; history.pointer++; restore(history.stack[history.pointer]); showToast('已重做'); }
function restore(s){
  history.suppress = true;
  Object.assign(project, JSON.parse(JSON.stringify(s)));
  rebuildAll();
  history.suppress = false;
}

function doAction(a){
  if      (a==='undo')   undo();
  else if (a==='redo')   redo();
  else if (a==='delete') deleteSelected();
  else if (a==='zoom-in')  zoomBy(1.25);
  else if (a==='zoom-out') zoomBy(0.8);
  else if (a==='zoom-fit') resetView();
}

/* ============= Shape factories ============= */
function createWallShape(w){
  const line = new Konva.Line({
    points: w.points, stroke:'#e5e7eb', strokeWidth:8, lineCap:'round', lineJoin:'round',
    draggable:true, name:'wall',
  });
  line.id(w.id);
  line.on('click tap', () => { if (currentTool==='select') selectShape(line, 'wall', w); });
  line.on('dragend', () => {
    const dx=line.x(), dy=line.y();
    w.points = w.points.map((v,i)=> v + (i%2===0 ? dx : dy));
    line.x(0); line.y(0); line.points(w.points);
    snapshot(); recalcBOM();
  });
  layers.walls.add(line); return line;
}
function createDeviceShape(d){
  const c = DEVICE_CATALOG.find(x=>x.id===d.type); if(!c) return null;
  const g = new Konva.Group({ x:d.x, y:d.y, draggable:true, name:'device', rotation:d.rotation||0 });
  g.id(d.id);
  g.add(new Konva.Rect({ width:c.w, height:c.h, fill:c.color, cornerRadius:4, stroke:'rgba(255,255,255,0.45)', strokeWidth:1 }));
  g.add(new Konva.Text({ text:c.icon, fontSize: Math.min(c.h*0.7,22), x:4, y:c.h*0.18 }));
  g.add(new Konva.Text({ text:c.name, fontSize:Math.max(9, Math.min(11, c.w/7)), fill:'#fff', x:28, y:5, width:c.w-32, ellipsis:true, wrap:'none' }));
  g.on('click tap', () => { if (currentTool==='select') selectShape(g, 'device', d); });
  g.on('dragend', () => { d.x=g.x(); d.y=g.y(); snapshot(); recalcBOM(); });
  layers.devices.add(g); return g;
}
function createPipeShape(p){
  const c = PIPE_CATALOG.find(x=>x.id===p.type); if(!c) return null;
  const line = new Konva.Line({
    points:p.points, stroke:c.color, strokeWidth:4, lineCap:'round', lineJoin:'round',
    dash: c.dash ? [10,6] : undefined, draggable:true, name:'pipe',
  });
  line.id(p.id);
  line.on('click tap', () => { if (currentTool==='select') selectShape(line, 'pipe', p); });
  line.on('dragend', () => {
    const dx=line.x(), dy=line.y();
    p.points = p.points.map((v,i)=> v + (i%2===0 ? dx : dy));
    line.x(0); line.y(0); line.points(p.points);
    snapshot(); recalcBOM();
  });
  layers.pipes.add(line); return line;
}
function createOpeningShape(o, isDoor){
  const W = isDoor ? 45 : 75, H = 12;
  const g = new Konva.Group({ x:o.x, y:o.y, draggable:true, name: isDoor?'door':'window', rotation:o.rotation||0 });
  g.id(o.id);
  g.add(new Konva.Rect({ width:W, height:H, fill: isDoor?'#fbbf24':'#60a5fa', stroke:'#fff', strokeWidth:1, cornerRadius:2 }));
  g.add(new Konva.Text({ text: isDoor?'门':'窗', fontSize:9, fill:'#fff', x:6, y:1, width:W-10 }));
  g.on('click tap', () => { if (currentTool==='select') selectShape(g, isDoor?'door':'window', o); });
  g.on('dragend', () => { o.x=g.x(); o.y=g.y(); snapshot(); recalcBOM(); });
  layers.walls.add(g); return g;
}
function createTextShape(t){
  const txt = new Konva.Text({ x:t.x, y:t.y, text:t.text, fontSize:t.size||14, fill:'#fff', draggable:true, name:'text' });
  txt.id(t.id);
  txt.on('dblclick dbltap', () => {
    const nv = prompt('文字内容:', t.text);
    if (nv !== null) { t.text = nv; txt.text(nv); layers.annot.batchDraw(); snapshot(); }
  });
  txt.on('click tap', () => { if (currentTool==='select') selectShape(txt, 'text', t); });
  txt.on('dragend', () => { t.x=txt.x(); t.y=txt.y(); snapshot(); });
  layers.annot.add(txt); return txt;
}

/* ============= Selection & Properties ============= */
function selectShape(node, kind, data){
  tr.nodes([node]);
  selected = { node, kind, data };
  renderProps();
  layers.annot.batchDraw();
}
function clearSelection(){
  tr.nodes([]); selected = null; renderProps(); layers.annot.batchDraw();
}
function deleteSelected(){
  if (!selected) return;
  const { node, kind, data } = selected;
  const map = { wall:'walls', device:'devices', pipe:'pipes', door:'doors', window:'windows', text:'texts' };
  const key = map[kind]; if (key) project[key] = project[key].filter(x => x.id !== data.id);
  node.destroy(); clearSelection(); snapshot(); recalcBOM(); showToast('已删除');
}
function duplicateSelected(){
  if (!selected) return;
  const { kind, data } = selected;
  const c = JSON.parse(JSON.stringify(data)); c.id = uid(kind);
  if ('x' in c) c.x += 30; if ('y' in c) c.y += 30;
  if ('points' in c) c.points = c.points.map(v => v + 30);
  if      (kind==='device') { project.devices.push(c); createDeviceShape(c); }
  else if (kind==='wall')   { project.walls.push(c);   createWallShape(c); }
  else if (kind==='pipe')   { project.pipes.push(c);   createPipeShape(c); }
  else if (kind==='door')   { project.doors.push(c);   createOpeningShape(c, true); }
  else if (kind==='window') { project.windows.push(c); createOpeningShape(c, false); }
  else if (kind==='text')   { project.texts.push(c);   createTextShape(c); }
  stage.batchDraw(); snapshot(); recalcBOM();
}
window.deleteSelected = deleteSelected;
window.duplicateSelected = duplicateSelected;

function renderProps(){
  const panel = document.getElementById('propsPanel');
  if (!selected){ panel.innerHTML = '<div class="insp-empty">未选中对象<br>选择工具 V · 点击对象</div>'; return; }
  const { kind, data } = selected;
  const labels = { device:'设备', wall:'墙体', pipe:'管路', door:'门', window:'窗', text:'文字' };
  let html = `<div class="prop-row" style="margin-bottom:10px"><label>类型</label><strong style="color:var(--gold-light)">${labels[kind]||kind}</strong></div>`;
  if (kind==='device'){
    const c = DEVICE_CATALOG.find(x=>x.id===data.type);
    html += `<div class="prop-row"><label>名称</label><span style="font-size:11.5px;color:var(--text-2)">${c?.name||'-'}</span></div>`;
    html += `<div class="prop-row"><label>X</label><input type="number" value="${Math.round(data.x)}" data-prop="x"></div>`;
    html += `<div class="prop-row"><label>Y</label><input type="number" value="${Math.round(data.y)}" data-prop="y"></div>`;
    html += `<div class="prop-row"><label>旋转</label><input type="number" value="${Math.round(data.rotation||0)}" data-prop="rotation"></div>`;
    html += `<div class="prop-row"><label>单价</label><strong style="color:var(--gold-light)">¥${(c?.price||0).toLocaleString()}/${c?.unit||''}</strong></div>`;
  } else if (kind==='pipe'){
    const c = PIPE_CATALOG.find(x=>x.id===data.type);
    const len = pipeLenPx(data.points)/GRID;
    html += `<div class="prop-row"><label>类型</label><span style="font-size:11.5px;color:var(--text-2)">${c?.name||'-'}</span></div>`;
    html += `<div class="prop-row"><label>长度</label><strong>${len.toFixed(2)} m</strong></div>`;
    html += `<div class="prop-row"><label>小计</label><strong style="color:var(--gold-light)">¥${Math.round(len*(c?.priceM||0)).toLocaleString()}</strong></div>`;
  } else if (kind==='wall'){
    const len = pipeLenPx(data.points)/GRID;
    html += `<div class="prop-row"><label>长度</label><strong>${len.toFixed(2)} m</strong></div>`;
    html += `<div class="prop-row"><label>厚度</label><span>240mm</span></div>`;
  } else if (kind==='text'){
    html += `<div class="prop-row"><label>内容</label><input type="text" value="${data.text}" data-prop="text"></div>`;
    html += `<div class="prop-row"><label>字号</label><input type="number" value="${data.size||14}" data-prop="size"></div>`;
  } else if (kind==='door' || kind==='window'){
    html += `<div class="prop-row"><label>X</label><input type="number" value="${Math.round(data.x)}" data-prop="x"></div>`;
    html += `<div class="prop-row"><label>Y</label><input type="number" value="${Math.round(data.y)}" data-prop="y"></div>`;
    html += `<div class="prop-row"><label>旋转</label><input type="number" value="${Math.round(data.rotation||0)}" data-prop="rotation"></div>`;
  }
  html += `<div class="insp-actions"><button onclick="duplicateSelected()">复制</button><button class="btn-danger" onclick="deleteSelected()">删除</button></div>`;
  panel.innerHTML = html;
  panel.querySelectorAll('input[data-prop]').forEach(inp => {
    inp.addEventListener('change', () => {
      const k = inp.dataset.prop;
      const v = inp.type==='number' ? +inp.value : inp.value;
      data[k] = v;
      const n = selected.node;
      if (n){
        if (k==='x') n.x(v);
        else if (k==='y') n.y(v);
        else if (k==='rotation') n.rotation(v);
        else if (k==='text' && selected.kind==='text') n.text(v);
        else if (k==='size' && selected.kind==='text') n.fontSize(v);
        n.getLayer()?.batchDraw();
      }
      snapshot(); recalcBOM();
    });
  });
}

/* ============= Drawing logic ============= */
function cancelDrawing(){
  if (drawing.previewLine){ drawing.previewLine.destroy(); drawing.previewLine = null; }
  drawing.active = false; drawing.points = [];
  layers.annot.batchDraw();
}

stage.on('mousemove touchmove', () => {
  const p = pointerPos(); const sp = snapPt(p);
  document.getElementById('coords').textContent = `${(sp.x/GRID).toFixed(2)}m, ${(sp.y/GRID).toFixed(2)}m`;
  if (drawing.active && drawing.previewLine){
    drawing.previewLine.points([...drawing.points, sp.x, sp.y]);
    layers.annot.batchDraw();
  }
});

stage.on('click tap', e => {
  if (currentTool === 'select'){
    if (e.target === stage) clearSelection();
    return;
  }
  const sp = snapPt(pointerPos());

  if (currentTool === 'wall' || currentTool === 'pipe'){
    if (!drawing.active){
      drawing.active = true; drawing.points = [sp.x, sp.y];
      const stroke = currentTool==='wall' ? '#e5e7eb' : (currentLibItem?.color || '#3399FF');
      const sw = currentTool==='wall' ? 8 : 4;
      drawing.previewLine = new Konva.Line({ points:[sp.x,sp.y,sp.x,sp.y], stroke, strokeWidth:sw, lineCap:'round', lineJoin:'round', dash:[6,4], opacity:0.7 });
      layers.annot.add(drawing.previewLine);
    } else {
      drawing.points.push(sp.x, sp.y);
    }
  }
  else if (currentTool === 'device' && currentLibItem){
    const dev = { id:uid('dev'), type:currentLibItem.id, x:sp.x - currentLibItem.w/2, y:sp.y - currentLibItem.h/2, rotation:0 };
    project.devices.push(dev); createDeviceShape(dev);
    layers.devices.batchDraw(); snapshot(); recalcBOM();
  }
  else if (currentTool === 'door' || currentTool === 'window'){
    const isDoor = currentTool === 'door';
    const o = { id:uid(isDoor?'door':'win'), x:sp.x - 22, y:sp.y - 6, rotation:0 };
    if (isDoor) project.doors.push(o); else project.windows.push(o);
    createOpeningShape(o, isDoor);
    layers.walls.batchDraw(); snapshot(); recalcBOM();
  }
  else if (currentTool === 'text'){
    const txt = prompt('文字内容（如：客厅 / 主卧）:', '客厅');
    if (txt){
      const t = { id:uid('txt'), x:sp.x, y:sp.y, text:txt, size:14 };
      project.texts.push(t); createTextShape(t);
      layers.annot.batchDraw(); snapshot();
    }
  }
});

function finishDrawing(){
  if (!drawing.active || drawing.points.length < 4){ cancelDrawing(); return; }
  const points = [...drawing.points];
  if (currentTool === 'wall'){
    const w = { id:uid('wall'), points };
    project.walls.push(w); createWallShape(w); layers.walls.batchDraw();
  } else if (currentTool === 'pipe' && currentLibItem){
    const p = { id:uid('pipe'), points, type:currentLibItem.id };
    project.pipes.push(p); createPipeShape(p); layers.pipes.batchDraw();
  }
  cancelDrawing(); snapshot(); recalcBOM();
}

stage.on('dblclick dbltap', finishDrawing);

container.addEventListener('contextmenu', e => {
  if (drawing.active && (currentTool === 'wall' || currentTool === 'pipe')) {
    e.preventDefault();
    finishDrawing();
  }
});

/* ============= BOM & Quote ============= */
function buildBOM(){
  const bom = {};
  project.devices.forEach(d => {
    const c = DEVICE_CATALOG.find(x=>x.id===d.type); if(!c) return;
    if (!bom[c.id]) bom[c.id] = { id:c.id, name:c.name, category:'equipment', qty:0, unit:c.unit, unitPrice:c.price, total:0 };
    bom[c.id].qty++; bom[c.id].total += c.price;
  });
  project.pipes.forEach(p => {
    const c = PIPE_CATALOG.find(x=>x.id===p.type); if(!c) return;
    const m = pipeLenPx(p.points)/GRID;
    if (!bom[c.id]) bom[c.id] = { id:c.id, name:c.name, category:'pipe', qty:0, unit:c.unit, unitPrice:c.priceM, total:0 };
    bom[c.id].qty += m; bom[c.id].total += m * c.priceM;
  });
  if (project.doors.length){ bom['door']  = { id:'door', name:'门 (含框)', category:'opening', qty:project.doors.length, unit:'樘', unitPrice:1800, total:project.doors.length*1800 }; }
  if (project.windows.length){ bom['win'] = { id:'win', name:'窗 (含框)', category:'opening', qty:project.windows.length, unit:'扇', unitPrice:2400, total:project.windows.length*2400 }; }
  return Object.values(bom);
}
function recalcBOM(){
  document.getElementById('objCount').textContent = project.devices.length + project.pipes.length + project.walls.length + project.doors.length + project.windows.length;
  const items = buildBOM();
  latestBOMItems = items;
  const tbody = items.length === 0
    ? '<tr class="empty"><td colspan="4">暂无设备 / 管路</td></tr>'
    : items.map(i => `<tr><td>${i.name}</td><td>${i.qty.toFixed(i.unit==='m'?1:0)} ${i.unit}</td><td>${money(i.unitPrice)}</td><td>${money(i.total)}</td></tr>`).join('');
  document.getElementById('bomTable').innerHTML = `<thead><tr><th>项目</th><th>数量</th><th>单价</th><th>小计</th></tr></thead><tbody>${tbody}</tbody>`;
  if (!items.length){
    latestQuote = null;
    document.getElementById('quoteSummary').innerHTML = '<div class="insp-empty">添加设备/管路后自动估算</div>';
    return;
  }
  document.getElementById('quoteSummary').innerHTML = '<div class="insp-empty">正在调用后端成本模型...</div>';
  scheduleBackendQuote(items);
}

function quotePayload(items){
  return {
    items: items.map(i => ({
      id: i.id,
      name: i.name,
      category: i.category,
      qty: i.qty,
      unit: i.unit,
      unitPrice: i.unitPrice,
      total: i.total
    })),
    project: {
      name: document.getElementById('projectName').value || project.name || '未命名项目',
      area: estimateProjectArea(items),
      city: '其他',
      floor: 10
    },
    dealer: { tier: 'standard' },
    options: { taxRate: 0.06, financingMonths: 36 }
  };
}

function estimateProjectArea(items){
  const pipeMeters = items.filter(i => i.category === 'pipe').reduce((s,i)=>s+i.qty, 0);
  return Math.max(60, Math.round(pipeMeters ? pipeMeters / 2.6 : 80));
}

function scheduleBackendQuote(items){
  clearTimeout(quoteDebounceTimer);
  quoteDebounceTimer = setTimeout(() => fetchBackendQuote(items), 260);
}

async function fetchBackendQuote(items){
  const seq = ++quoteRequestSeq;
  try {
    const res = await fetch('/api/quotation-v2/from-bom', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(quotePayload(items))
    });
    const json = await res.json();
    if (seq !== quoteRequestSeq) return;
    if (!res.ok || !json.success) throw new Error(json.error || '报价服务暂不可用');
    latestQuote = json.data;
    renderQuoteSummary(latestQuote);
  } catch (err) {
    if (seq !== quoteRequestSeq) return;
    latestQuote = buildLocalQuoteFallback(items);
    renderQuoteSummary(latestQuote, true);
  }
}

function buildLocalQuoteFallback(items){
  const materialSubtotal = Math.round(items.reduce((s,i)=>s+i.total, 0));
  const labor = Math.max(1200, Math.round(materialSubtotal * 0.12));
  const auxiliary = Math.max(600, Math.round(materialSubtotal * 0.06));
  const management = Math.max(800, Math.round(materialSubtotal * 0.035));
  const riskReserve = Math.round((materialSubtotal + labor + auxiliary) * 0.03);
  const directCost = materialSubtotal + labor + auxiliary + management + riskReserve;
  const customerTotal = Math.round(directCost / 0.8 * 1.06);
  return {
    source:'local-fallback',
    summary:{ materialSubtotal, labor, auxiliary, management, riskReserve, directCost, tax:Math.round(customerTotal/1.06*0.06), customerTotal, monthlyPayment:Math.round(customerTotal/36), grossMarginRate:0.20 },
    costBreakdown:[
      { code:'materials', name:'设备/管路材料', amount:materialSubtotal },
      { code:'labor', name:'安装人工', amount:labor },
      { code:'auxiliary', name:'辅材与损耗', amount:auxiliary },
      { code:'management', name:'项目管理与质检', amount:management },
      { code:'risk', name:'施工风险预备', amount:riskReserve }
    ],
    marginGuard:{ status:'fallback', quoteFloor:directCost },
    items,
    assumptions:['本地临时估算仅用于离线预览，正式客户报价必须以服务器返回为准']
  };
}

function renderQuoteSummary(quote, isFallback=false){
  const s = quote.summary;
  const guardText = quote.marginGuard?.status === 'pass' ? '毛利护栏通过' :
    quote.marginGuard?.status === 'floor_adjusted' ? '已按底价护栏上调' : '离线临时估算';
  document.getElementById('quoteSummary').innerHTML = `
    <div class="qs-line"><span>设备/管路材料</span><strong>${money(s.materialSubtotal)}</strong></div>
    <div class="qs-line"><span>安装人工</span><strong>${money(s.labor)}</strong></div>
    <div class="qs-line"><span>辅材与损耗</span><strong>${money(s.auxiliary)}</strong></div>
    <div class="qs-line"><span>项目管理/风险</span><strong>${money((s.management||0)+(s.riskReserve||0))}</strong></div>
    <div class="qs-line"><span>税费</span><strong>${money(s.tax || 0)}</strong></div>
    <div class="qs-line qs-total"><span>客户报价</span><strong>${money(s.customerTotal)}</strong></div>
    <div class="qs-monthly">分 36 期 · 约 ${money(s.monthlyPayment)}/月 · ${guardText}${isFallback ? ' · 待服务器复核' : ''}</div>
  `;
}

function getDealFormValues(){
  const user = getStoredUser() || {};
  return {
    customerId: document.getElementById('dealCustomerId')?.value?.trim() || user.customerId || '',
    customerSigner: document.getElementById('dealCustomerSigner')?.value?.trim() || '',

  };

function setDealStatus(message, tone=''){
  const el = document.getElementById('dealStatus');
  if (!el) return;
  el.textContent = message;
  el.className = `deal-status ${tone}`.trim();
}

function contractNo(){
  return dealLoopState.contract?.contractNo || '';
}

      </div>
      <div class="deal-loop-body">
        <div class="deal-form">
          <div class="deal-field">
            <label for="dealCustomerId">客户 ID</label>

          </div>
          <div class="deal-field">
            <label for="dealCustomerSigner">客户签署人</label>
            <input id="dealCustomerSigner" placeholder="例如：王女士" value="${c.signature?.customerSigner || ''}" autocomplete="off">
          </div>
          <div class="deal-field is-wide">
            <label for="dealProjectAddress">项目地址</label>
            <input id="dealProjectAddress" placeholder="用于交付启动和客户项目门户" value="${c.project?.address || ''}" autocomplete="off">
          </div>

            <label for="dealDepositAmount">首付款金额</label>

          <div class="deal-step ${stepClass.payment}"><strong>3. 首付款</strong><span>${paymentStatus === 'partial' || paymentStatus === 'paid' ? '已登记收款' : '默认记录 deposit 节点'}</span></div>
          <div class="deal-step ${stepClass.delivery}"><strong>4. 交付启动</strong><span>${handoffStatus === 'linked' ? '已生成生命周期交接' : '仅 IoT lifecycle handoff'}</span></div>

          <button class="is-primary" onclick="createContractFromQuote()">创建合同</button>
          <button onclick="markContractSignature()" ${c.contractNo ? '' : 'disabled'}>登记签署</button>
          <button onclick="recordContractDeposit()" ${signatureStatus === 'signed' ? '' : 'disabled'}>登记首付款</button>
          <button onclick="startContractDelivery()" ${signatureStatus === 'signed' ? '' : 'disabled'}>启动交付</button>
          <button onclick="openCustomerProject()" ${c.contractNo ? '' : 'disabled'}>客户项目门户</button>
        </div>
        <div class="deal-status ${hasToken ? '' : 'warn'}" id="dealStatus">${hasToken ? '合同链路待执行。' : '未检测到 localStorage token：请先从员工/设计师入口登录，再创建合同。'}</div>
      </div>
    </div>
  `;
}

function refreshDealLoop(quote = latestQuote, items = latestBOMItems){
  const host = document.getElementById('dealLoopHost');
  if (host) host.innerHTML = renderDealLoop(quote, items);
}

window.createContractFromQuote = async function(){
  const quote = latestQuote;
  const items = latestBOMItems.length ? latestBOMItems : buildBOM();
  if (!quote || !items.length) {
    setDealStatus('请先生成报价和 BOM，再创建合同。', 'warn');
    return;
  }
  const form = getDealFormValues();
  if (!form.customerId) {
    setDealStatus('缺少客户 ID：合同必须绑定 CustomerV2，不能用匿名客户创建生产合同。', 'warn');
    return;
  }
  try {
    setDealStatus('正在保存报价并创建合同...');
    const normalizedQuote = normalizeQuoteForContract(quote, items);
    const projectMeta = { ...normalizedQuote.project, address: form.projectAddress };
    const persisted = await persistQuotationFromQuote(form.customerId, quote, items, projectMeta);
    const data = await contractApi('/api/v2/contracts/from-quotation', {
      method:'POST',
      body: {
        customerId: form.customerId,
        quotationId: persisted.quotationId,
        quotationNo: persisted.quotationNo,
        project: projectMeta,
        systemFamilies: normalizedQuote.systemFamilies,
        lifecycleHandoff: {
          required: true,
          servicePlanCode: 'comfort-lifecycle-standard',
          handoffBoundary: 'lifecycle_handoff_only'
        },
        termsVersion: 'rhautt-nexus-contract-v1'
      }
    });
    dealLoopState.contract = data.contract;
    dealLoopState.paymentKey = data.contract?.paymentSchedule?.[0]?.key || 'deposit';
    refreshDealLoop(quote, items);
    setDealStatus(`报价已保存：${persisted.quotationNo || persisted.quotationId}\n合同已创建：${contractNo()}\n下一步：登记客户签署。`, 'ok');
  } catch (err) {
    dealLoopState.lastError = err.message;
    setDealStatus(err.message, err.status === 401 ? 'warn' : 'error');
  }
};

window.markContractSignature = async function(){
  const id = contractNo();
  if (!id) return setDealStatus('请先创建合同。', 'warn');
  const form = getDealFormValues();
  if (!form.customerSigner) return setDealStatus('请填写客户签署人。', 'warn');
  try {
    setDealStatus('正在登记客户签署...');
    dealLoopState.contract = await contractApi(`/api/v2/contracts/${encodeURIComponent(id)}/signature`, {
      method:'POST',
      body: {
        method: 'customer_portal_confirmation',
        customerSigner: form.customerSigner,
        termsVersion: 'rhautt-nexus-contract-v1',
        evidenceUrl: `/contracts/evidence/${encodeURIComponent(id)}.pdf`
      }
    });
    refreshDealLoop();
    setDealStatus(`合同已签署：${id}\n下一步：登记首付款或启动交付。`, 'ok');
  } catch (err) {
    setDealStatus(err.message, err.status === 401 ? 'warn' : 'error');
  }
};

window.recordContractDeposit = async function(){
  const id = contractNo();
  if (!id) return setDealStatus('请先创建合同。', 'warn');
  const form = getDealFormValues();
  if (!form.depositAmount || form.depositAmount <= 0) return setDealStatus('首付款金额必须大于 0。', 'warn');
  try {
    setDealStatus('正在登记首付款...');
    dealLoopState.contract = await contractApi(`/api/v2/contracts/${encodeURIComponent(id)}/payments`, {
      method:'POST',
      body: {
        key: dealLoopState.paymentKey || 'deposit',
        amount: form.depositAmount,
        method: form.paymentMethod,
        receiptNo: `RC-${Date.now()}`,
        note: '设计师工作台成交闭环首付款登记'
      }
    });
    refreshDealLoop();
    setDealStatus(`首付款已登记：${money(form.depositAmount)}\n下一步：启动交付并生成生命周期交接。`, 'ok');
  } catch (err) {
    setDealStatus(err.message, err.status === 401 ? 'warn' : 'error');
  }
};

window.startContractDelivery = async function(){
  const id = contractNo();
  if (!id) return setDealStatus('请先创建合同。', 'warn');
  const form = getDealFormValues();
  try {
    setDealStatus('正在启动交付和 IoT 生命周期交接...');
    const result = await contractApi(`/api/v2/contracts/${encodeURIComponent(id)}/delivery-start`, {
      method:'POST',
      body: {
        projectAddress: form.projectAddress,
        systems: deriveSystemFamilies(latestBOMItems),
        devices: latestBOMItems.filter(i => i.category === 'equipment').map(i => ({
          name: i.name,
          quantity: i.qty,
          systemFamily: mapSystemFamily(i)
        })),
        iot: {
          platform: 'rhautt-iot',
          handoffBoundary: 'lifecycle_handoff_only'
        },
        servicePlan: {
          code: 'comfort-lifecycle-standard'
        }
      }
    });
    dealLoopState.contract = result.contract;
    refreshDealLoop();
    setDealStatus(`交付已启动：${id}\n已创建客户项目生命周期交接，边界：lifecycle_handoff_only。`, 'ok');
  } catch (err) {
    setDealStatus(err.message, err.status === 401 ? 'warn' : 'error');
  }
};

window.openCustomerProject = function(){
  const id = contractNo();
  if (!id) return setDealStatus('请先创建合同。', 'warn');
  window.open(`/customer-view.html?contractId=${encodeURIComponent(id)}`, '_blank');
};

/* ============= Save / Load ============= */
window.exportPNG = function(){
  // hide transformer for clean export
  tr.visible(false); layers.annot.batchDraw();
  const dataURL = stage.toDataURL({ pixelRatio:2 });
  tr.visible(true); layers.annot.batchDraw();
  const a = document.createElement('a');
  a.download = (project.name || 'design') + '.png';
  a.href = dataURL; a.click();
  showToast('PNG 已导出');
};
window.exportJSON = function(){
  project.name = document.getElementById('projectName').value || '未命名项目';
  const data = JSON.stringify(project, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const a = document.createElement('a');
  a.download = project.name + '.rh-design.json';
  a.href = URL.createObjectURL(blob); a.click();
  showToast('方案已保存');
};
window.loadJSON = function(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        Object.assign(project, { walls:[], devices:[], pipes:[], doors:[], windows:[], texts:[] }, data);
        document.getElementById('projectName').value = project.name;
        rebuildAll(); snapshot();
        showToast('方案已载入: '+project.name);
      } catch(err){ showToast('载入失败: '+err.message); }
    };
    r.readAsText(f);
  };
  inp.click();
};

function rebuildAll(){
  ['walls','pipes','devices','annot'].forEach(k => layers[k].destroyChildren());
  layers.annot.add(tr);
  project.walls.forEach(w => createWallShape(w));
  project.pipes.forEach(p => createPipeShape(p));
  project.devices.forEach(d => createDeviceShape(d));
  project.doors.forEach(d => createOpeningShape(d, true));
  project.windows.forEach(w => createOpeningShape(w, false));
  project.texts.forEach(t => createTextShape(t));
  stage.batchDraw(); recalcBOM();
}

function autoSave(){
  project.name = document.getElementById('projectName').value || '未命名项目';
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(project));
    document.getElementById('autoSaveHint').textContent = getAuthToken()
      ? '本地已保存 · 正在同步工作台'
      : '本地已保存 · 登录后同步工作台';
    scheduleWorkspacePersist();
  } catch(e){}
}
function loadAutoSave(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return false;
    const data = JSON.parse(raw);
    Object.assign(project, { walls:[], devices:[], pipes:[], doors:[], windows:[], texts:[] }, data);
    document.getElementById('projectName').value = project.name;
    rebuildAll();
    if (project.devices.length || project.pipes.length || project.walls.length) showToast('已恢复上次会话: '+project.name);
    return true;
  } catch(e){ return false; }
}

/* ============= Zoom / Pan ============= */
function zoomBy(f){
  const oldS = stage.scaleX();
  const newS = Math.max(0.3, Math.min(3, oldS * f));
  const center = { x: stage.width()/2, y: stage.height()/2 };
  const mp = { x: (center.x - stage.x()) / oldS, y: (center.y - stage.y()) / oldS };
  stage.scale({ x:newS, y:newS });
  stage.position({ x: center.x - mp.x * newS, y: center.y - mp.y * newS });
  stage.batchDraw();
  document.getElementById('zoomLevel').textContent = Math.round(newS*100) + '%';
}
function resetView(){ stage.scale({x:1,y:1}); stage.position({x:0,y:0}); stage.batchDraw(); document.getElementById('zoomLevel').textContent = '100%'; }
container.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 0.9 : 1.1;
  const ptr = stage.getPointerPosition(); if (!ptr) return;
  const oldS = stage.scaleX();
  const newS = Math.max(0.3, Math.min(3, oldS * f));
  const mp = { x: (ptr.x - stage.x()) / oldS, y: (ptr.y - stage.y()) / oldS };
  stage.scale({ x:newS, y:newS });
  stage.position({ x: ptr.x - mp.x * newS, y: ptr.y - mp.y * newS });
  stage.batchDraw();
  document.getElementById('zoomLevel').textContent = Math.round(newS*100) + '%';
}, { passive:false });

// 中键拖拽平移
let panning = false;
stage.on('mousedown', e => { if (e.evt.button === 1){ panning = true; stage.draggable(true); }});
stage.on('mouseup',   e => { if (panning){ panning = false; stage.draggable(false); }});

/* ============= Keyboard ============= */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey){
    if      (k==='z'){ e.preventDefault(); undo(); }
    else if (k==='y'){ e.preventDefault(); redo(); }
    else if (k==='s'){ e.preventDefault(); exportJSON(); }
    return;
  }
  if      (k==='escape') cancelDrawing();
  else if (k==='enter') finishDrawing();
  else if (k==='delete' || k==='backspace') deleteSelected();
  else if (k==='v') setTool('select');
  else if (k==='w') setTool('wall');
  else if (k==='d') setTool('door');
  else if (k==='n') setTool('window');
  else if (k==='e') setTool('device');
  else if (k==='p') setTool('pipe');
  else if (k==='t') setTool('text');
});

document.getElementById('projectName').addEventListener('change', () => { project.name = document.getElementById('projectName').value; autoSave(); });

/* ============= Init & Resize ============= */
function fitStage(){
  stage.width(container.clientWidth);
  stage.height(container.clientHeight);
  drawGrid();
  stage.batchDraw();
}
window.addEventListener('resize', fitStage);

fitStage();
renderLib();
const restored = loadAutoSave();
if (!restored) snapshot();
setInterval(autoSave, 5000);
</script>
