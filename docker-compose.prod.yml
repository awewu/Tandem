# 生产环境Docker Compose配置
# 150人团队6大系统一键计算平台

version: '3.8'

services:
  # API服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rheem-6systems-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/rheem_calc
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - API_RATE_LIMIT=1000
    depends_on:
      - mongo
      - redis
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - rheem-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/oneclick/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB数据库
  mongo:
    image: mongo:7
    container_name: rheem-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=rheem_calc
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - rheem-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: rheem-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rheem-network

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: rheem-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - rheem-network

  # 监控 - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: rheem-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - rheem-network

  # 监控 - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: rheem-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - rheem-network

volumes:
  mongo-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  rheem-network:
    driver: bridge
