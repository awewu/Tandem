# GitLab CI · Tandem
#
# 兼容老版本 GitLab：不使用 extends / rules / needs / service variables。
# 当前发布环境：Linux shell Runner 只上传源码，Windows Server 本机打包并蓝绿发布。

stages:
  - package
  - deploy

variables:
  DEPLOY_ROOT: "E:/tandem-deploy"
  DEPLOY_NGINX_EXE: "E:/soft/nginx-1.30.2/nginx.exe"
  DEPLOY_PUBLIC_BASE_URL: "https://ai.rhautt.com"
  DEPLOY_NOTIFY_WEBHOOK_TYPE: "wecom"

package_source:
  stage: package
  tags:
    - linux
  only:
    - deploy
  script:
    - git archive --format=zip --output=tandem-source.zip HEAD
  artifacts:
    paths:
      - tandem-source.zip
    expire_in: 1 day

deploy_prod:
  stage: deploy
  tags:
    - linux
  only:
    - deploy
  script:
    - mkdir -p ~/.ssh
    - printf '%s' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_tandem_deploy
    - chmod 600 ~/.ssh/id_tandem_deploy
    - ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - ssh -i ~/.ssh/id_tandem_deploy "$DEPLOY_USER@$DEPLOY_HOST" "powershell -ExecutionPolicy Bypass -Command \"New-Item -ItemType Directory -Force '$DEPLOY_ROOT','${DEPLOY_ROOT}/update','${DEPLOY_ROOT}/nginx' | Out-Null\""
    - scp -i ~/.ssh/id_tandem_deploy scripts/deploy-windows-nssm-from-source.ps1 "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/deploy-windows-nssm-from-source.ps1"
    - scp -i ~/.ssh/id_tandem_deploy scripts/deploy-windows-nssm-bluegreen.ps1 "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/deploy-windows-nssm-bluegreen.ps1"
    - scp -i ~/.ssh/id_tandem_deploy tandem-source.zip "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/update/tandem-source.zip"
    - ssh -i ~/.ssh/id_tandem_deploy "$DEPLOY_USER@$DEPLOY_HOST" "powershell -ExecutionPolicy Bypass -File $DEPLOY_ROOT/deploy-windows-nssm-from-source.ps1 -Root $DEPLOY_ROOT -SourcePackageName tandem-source.zip -BlueServiceName TandemServerBlue -GreenServiceName TandemServerGreen -BluePort 3005 -GreenPort 3006 -NginxExe '$DEPLOY_NGINX_EXE' -NginxUpstreamFile '$DEPLOY_ROOT/nginx/tandem-upstream.conf' -PublicBaseUrl '$DEPLOY_PUBLIC_BASE_URL' -NotifyWebhookUrl '$DEPLOY_NOTIFY_WEBHOOK_URL' -NotifyWebhookType '$DEPLOY_NOTIFY_WEBHOOK_TYPE'"
  environment:
    name: production
