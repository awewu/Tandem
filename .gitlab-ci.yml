# GitLab CI · Tandem
#
# 兼容老版本 GitLab：不使用 extends / rules / needs / service variables。
# 当前发布环境：Windows shell Runner 构建打包，生产 Windows Server 只做蓝绿发布。

stages:
  - package
  - deploy

variables:
  GIT_CLEAN_FLAGS: "-ffdx -e NUL"
  DEPLOY_ROOT: "E:/tandem-deploy"
  DEPLOY_NGINX_EXE: "E:/soft/nginx-1.30.2/nginx.exe"
  DEPLOY_NGINX_PREFIX: "E:/soft/nginx-1.30.2"
  DEPLOY_NGINX_CONFIG: "conf/nginx.conf"
  DEPLOY_PUBLIC_BASE_URL: "https://ai.rhautt.com"
  DEPLOY_NOTIFY_WEBHOOK_TYPE: "wecom"

package_windows:
  stage: package
  tags:
    - windows-build
  only:
    - deploy
  script:
    - npm.cmd ci --no-audit --no-fund
    - npx.cmd tsc --noEmit
    - npm.cmd run lint
    - $env:TANDEM_SKIP_BUILD_CHECKS = "1"
    - $env:TANDEM_LOW_MEMORY_BUILD = "1"
    - powershell -NoProfile -ExecutionPolicy Bypass -File package-deploy.ps1 -OutputZip tandem-deploy.zip
  artifacts:
    paths:
      - tandem-deploy.zip
    expire_in: 1 day

deploy_prod:
  stage: deploy
  tags:
    - windows-build
  only:
    - deploy
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts\ci-deploy-from-windows-runner.ps1
  environment:
    name: production
