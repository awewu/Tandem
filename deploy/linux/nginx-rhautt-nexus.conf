map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream rhautt_nest_api {
    server 127.0.0.1:3300;
    keepalive 32;
}

upstream rhautt_legacy_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream rhautt_dealer_workbench {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name 192.1.1.111;

    client_max_body_size 100m;

    location = /brand {
        return 302 https://manage.rhautt.com/;
    }

    location = /diagnosis {
        return 302 https://rhautt.com/;
    }

    location /api/v2/ {
        proxy_pass http://rhautt_nest_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://rhautt_legacy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://rhautt_legacy_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://rhautt_dealer_workbench;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
