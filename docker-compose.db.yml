# Tandem · PostgreSQL (Docker)
# 
# 用法:
#   1. 安装 Docker Desktop 并启动
#   2. docker compose -f docker-compose.db.yml up -d
#   3. 数据库将在 localhost:5432 可用
#
# 更新 .env:
#   DATABASE_URL=postgresql://tandem:tandem@localhost:5432/tandem

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tandem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: tandem
      POSTGRES_DB: tandem
    ports:
      - '5440:5432'
    volumes:
      - tandem_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tandem']
      interval: 10s
      retries: 5

  # 组织云盘 (我的工作云盘) 对象存储 · MinIO (S3 兼容)
  # 用法: docker compose -f docker-compose.db.yml up -d minio
  #   API   : http://localhost:9000  (S3_ENDPOINT)
  #   控制台: http://localhost:9001  (账号=tandem / 密码=tandemsecret)
  # 首次自动建 bucket: tandem-drive, tandem-attachments
  minio:
    image: minio/minio:latest
    container_name: tandem-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tandem
      MINIO_ROOT_PASSWORD: tandemsecret
      MINIO_DEFAULT_BUCKETS: tandem-drive,tandem-attachments
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - tandem_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  tandem_pg_data:
  tandem_minio_data:
