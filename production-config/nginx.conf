gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

# HTTP → HTTPS 重定向
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/ssl/rysnova/server.crt;
    ssl_certificate_key /etc/ssl/rysnova/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── NestJS 原生模块（BIM / CRM / Brand）─────────────────────────
    location /api/v2/bim   { proxy_pass http://127.0.0.1:3300; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /api/v2/crm   { proxy_pass http://127.0.0.1:3300; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /api/v2/brand { proxy_pass http://127.0.0.1:3300; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }

    # ── 所有其他 API v2（Express 主服务，保持原有行为）────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }

    # ── 前端应用层 ────────────────────────────────────────────────────
    location /diagnosis  { proxy_pass http://127.0.0.1:4001; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /portal     { proxy_pass http://127.0.0.1:4002; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /designer   { proxy_pass http://127.0.0.1:4003; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /console    { proxy_pass http://127.0.0.1:4004; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /customer   { proxy_pass http://127.0.0.1:4005; proxy_http_version 1.1; proxy_set_header Host $host; }

    # ── 经销商工作台（dealer-workbench, 默认入口）────────────────────
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
