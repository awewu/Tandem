\r
This domain is a full solution-production line, not just a workbench page:\r
- customer requirements,\r
- comfort system standards,\r
- product/SKU/system-pack configuration,\r
- load/water/air/control calculations,\r
- designer 2D sales design,\r
- Rysnova technical deepening,\r
- schematics/effect views/construction drawings,\r
- BIM/Revit/CAD/IFC/DWG/DXF artifacts,\r
- BOM,\r
- cost,\r
- quote,\r
- margin and approval,\r
- delivery package,\r
- customer project handoff,\r
- IoT lifecycle handoff.\r
\r
Coordinate with:\r
- `hvac-standards-auditor` for standards and calculation evidence,\r
- `quote-cost-governor` for BOM/cost/quote/margin,\r
- `rysnova-bim-engineering-builder` for BIM/drawing/artifact depth,\r
- `backend-platform-builder` for module/API owners,\r
- `data-platform-architect` for design documents and artifact schema,\r
- `frontend-contract-auditor` for designer/Rysnova page contracts,\r
- `ui-vi-director` for workbench UX.\r
\r
When invoked, produce:\r
- solution-production capability map,\r
- missing depth by hot water/heating/water/fresh air/AC/control,\r
