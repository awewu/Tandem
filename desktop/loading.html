<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>瑞诺瓦AI舒适家</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #1a1f36 0%, #2d3561 100%);
    color: #fff; height: 100vh; display: flex;
    align-items: center; justify-content: center;
  }
  .wrap { text-align: center; width: 460px; }
  .brand { font-size: 28px; font-weight: 700; color: #E4002B; letter-spacing: 1px; }
  .sub { font-size: 14px; color: #9aa5be; margin-top: 8px; }
  .spinner {
    width: 44px; height: 44px; margin: 28px auto 20px;
    border: 4px solid rgba(255,255,255,0.15);
    border-top-color: #E4002B; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .log {
    margin-top: 16px; background: rgba(0,0,0,0.25); border-radius: 8px;
    padding: 14px 16px; font-size: 12px; color: #c3cad9;
    text-align: left; height: 160px; overflow-y: auto;
    font-family: "SF Mono", Menlo, monospace; line-height: 1.7;
  }
  .log .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">瑞诺瓦AI舒适家</div>
    <div class="sub">瑞诺瓦AI舒适家 · 经销商工作台</div>
    <div class="spinner"></div>
    <div class="log" id="log"></div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const logEl = document.getElementById('log');
    ipcRenderer.on('boot-progress', (_, text) => {
      const d = document.createElement('div');
      d.className = 'line';
      d.textContent = text;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    });
  </script>
</body>
</html>
